name: Compilar APK AIDA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Encontrar e extrair projeto mais novo
        id: projeto
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'AIDA_*_PROJETO.zip' -printf '%f\n' | sort -V | tail -1)
          if [ -z "$ZIP" ]; then
            echo "Nenhum AIDA_*_PROJETO.zip encontrado."
            exit 1
          fi
          echo "Usando: $ZIP"
          rm -rf projeto
          mkdir projeto
          unzip -q "$ZIP" -d projeto
          WRAPPER=$(find projeto -type f -name gradlew | head -1)
          if [ -z "$WRAPPER" ]; then
            echo "gradlew nao encontrado dentro de $ZIP"
            exit 1
          fi
          DIR=$(dirname "$WRAPPER")
          chmod +x "$WRAPPER"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Compilar APK Debug
        working-directory: ${{ steps.projeto.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Separar somente o APK novo
        shell: bash
        run: |
          mkdir -p apk-final
          APK=$(find projeto -type f -path '*/build/outputs/apk/debug/*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "APK novo nao encontrado em build/outputs/apk/debug."
            exit 1
          fi
          cp "$APK" apk-final/AIDA.apk
          ls -lh apk-final/AIDA.apk

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: AIDA-APK
          path: apk-final/AIDA.apk
          if-no-files-found: error
